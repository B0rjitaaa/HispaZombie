[project]
name = "hispazombie"
version = "0.0.1"
description = "RPG postapocalíptico de humor ambientado en Sevilla, al estilo RPG Maker 2000."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce>=2.5",
]

[dependency-groups]
dev = [
    "pygbag",
    "pyinstaller",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["hispazombie"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["hispazombie/build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["config", "engine", "escenas", "estado", "mundo", "ui"]
